<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Board, maskable: фон без скруглений (форму вырежет система) и знак
       ужат к центру до 72%, чтобы попасть в безопасную зону — круг в 80%
       ширины. Отсюда же иконка для iOS: прозрачных углов она не терпит.
       rsvg-convert -w 512 -h 512 public/icons/board-maskable.svg -o public/icons/board-maskable-512.png
       rsvg-convert -w 180 -h 180 public/icons/board-maskable.svg -o public/icons/board-180.png -->
  <rect width="512" height="512" fill="#1f2937"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)" fill="#ffffff">
    <rect x="120" y="150" width="60" height="212" rx="30"/>
    <rect x="226" y="196" width="60" height="166" rx="30"/>
    <rect x="332" y="242" width="60" height="120" rx="30"/>
  </g>
</svg>
