<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Paper, maskable: фон без скруглений (форму вырежет система) и знак
       ужат к центру до 72%, чтобы попасть в безопасную зону — круг в 80%
       ширины. Отсюда же иконка для iOS: прозрачных углов она не терпит.
       rsvg-convert -w 512 -h 512 public/icons/paper-maskable.svg -o public/icons/paper-maskable-512.png
       rsvg-convert -w 180 -h 180 public/icons/paper-maskable.svg -o public/icons/paper-180.png -->
  <rect width="512" height="512" fill="#faf6ec"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)" fill="none" stroke="#2b3a55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 198l46 46 90-104" stroke-width="46"/>
    <path d="M96 366c40 0 40-60 80-60s40 60 80 60 40-60 80-60 40 60 80 60" stroke-width="34"/>
  </g>
</svg>
