<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Знак приложения: галочка над волной — ровно то, что написано на вывеске,
       «Surf the Task». Без градиентов и теней: иконка живёт и в 16px во вкладке,
       и там от них остаётся только грязь. Зелёный тот же, что у строки состояния
       (theme_color), поэтому на телефоне иконка и шапка приложения одного тона.
       Отсюда же собраны png для установленного приложения (иконка iOS и
       maskable — из icon-maskable.svg, там фон без скруглений):
       rsvg-convert -w 192 -h 192 public/wave.svg -o public/icon-192.png
       rsvg-convert -w 512 -h 512 public/wave.svg -o public/icon-512.png -->
  <rect width="512" height="512" rx="112" fill="#166534"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Задача: галочка размашистая, чтобы читалась первой -->
    <path d="M188 198l46 46 90-104" stroke-width="46"/>
    <!-- Волна под ней: одна линия в два гребня; больше линий в мелком размере
         слипаются в полоску -->
    <path d="M96 366c40 0 40-60 80-60s40 60 80 60 40-60 80-60 40 60 80 60" stroke-width="34"/>
  </g>
</svg>
