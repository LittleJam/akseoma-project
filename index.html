<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=overlays-content: клавиатура ложится поверх страницы,
         а не ужимает её. По умолчанию браузер уменьшает область просмотра под
         клавиатуру, и вся раскладка на глазах перестраивается: борд сжимается,
         нижняя навигация подскакивает вверх -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>Surf the Task</title>
    <meta name="description" content="Kanban board, weekly schedule and notes — works offline" />

    <link rel="icon" type="image/svg+xml" href="/wave.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Цвет строки состояния: приложение подменяет его при смене темы -->
    <meta name="theme-color" content="#166534" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Surf" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
